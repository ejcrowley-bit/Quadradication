<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Trajectory: Quadratic Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --panel:#0c1222; --panel2:#111a30; --line:#1f2c4d;
  --cyan:#29e7ff; --mag:#ff3df2; --gold:#ffc94a; --red:#ff4058; --green:#3dff9a;
  --text:#d9e6ff; --dim:#7d8db3; --plasma:#29e7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;color:inherit}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;padding:inherit;display:none;flex-direction:column}
.screen.active{display:flex}
.hidden{display:none!important}
.orb{font-family:Orbitron,system-ui,sans-serif;letter-spacing:.06em}

/* ---------- menu ---------- */
#menu{align-items:center;justify-content:center;gap:14px;padding:24px;
  background:radial-gradient(ellipse at 50% 20%,#14245a 0%,#05070f 60%)}
.logo{font-family:Orbitron;font-weight:900;font-size:clamp(34px,11vw,64px);letter-spacing:.08em;
  background:linear-gradient(180deg,#fff 0%,var(--cyan) 60%,#0a6b85 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(41,231,255,.45));text-align:center;line-height:1}
.sub{font-family:Orbitron;font-weight:600;color:var(--mag);letter-spacing:.35em;font-size:13px;margin-top:-6px;text-align:center}
.rankcard{width:min(420px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin:8px 0}
.badge{width:52px;height:52px;flex:none}
.rankinfo{flex:1;min-width:0}
.rankname{font-family:Orbitron;font-weight:800;font-size:16px}
.xpbar{height:8px;background:#0a1020;border-radius:6px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 10px var(--cyan)}
.small{font-size:13px;color:var(--dim)}
.big{width:min(420px,100%);padding:16px;border-radius:12px;font-family:Orbitron;font-weight:800;font-size:17px;letter-spacing:.12em;
  background:linear-gradient(180deg,#14d7f0,#0a8fb0);color:#021018;box-shadow:0 0 22px rgba(41,231,255,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.big.alt{background:linear-gradient(180deg,#2a3a66,#18234a);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.big.mag{background:linear-gradient(180deg,#ff6af5,#b0139f);color:#1a0016;box-shadow:0 0 22px rgba(255,61,242,.35)}
.big:active{transform:translateY(1px) scale(.99)}
.ghostbtn{background:transparent;color:var(--dim);font-size:15px;padding:8px 12px}

/* ---------- generic list screens ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h2{margin:0;font-family:Orbitron;font-size:16px;letter-spacing:.12em;flex:1}
.back{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
.scroll{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.chapter{margin:4px 0 18px}
.chapter h3{font-family:Orbitron;font-size:13px;letter-spacing:.18em;color:var(--mag);margin:0 0 4px}
.chapter p{margin:0 0 10px;color:var(--dim);font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.mcard .num{font-family:Orbitron;font-size:11px;color:var(--dim);letter-spacing:.15em}
.mcard .nm{font-weight:700;font-size:17px;margin:2px 0 6px}
.mcard .st{color:var(--gold);letter-spacing:2px;font-size:16px}
.mcard.locked{opacity:.4}
.mcard.boss{border-color:#5a1830;background:linear-gradient(180deg,#2a0f22,#150812)}
.mcard.boss .num{color:var(--red)}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.stat b{font-family:Orbitron;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px}
.sw{width:64px;padding:8px 4px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font-size:12px;text-align:center}
.sw i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
.sw.sel{border-color:#fff}
.sw.lock{opacity:.35}
.sec{font-family:Orbitron;font-size:12px;letter-spacing:.18em;color:var(--cyan);margin:18px 0 4px}

/* ---------- game ---------- */
#game{background:var(--bg)}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
.hud .back{padding:6px 10px}
.hud .title{flex:1;min-width:0}
.hud .title .t1{font-family:Orbitron;font-size:10px;color:var(--dim);letter-spacing:.18em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .title .t2{font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:Orbitron;font-size:12px;padding:5px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.cr{color:var(--gold)}
.gamebody{flex:1;display:flex;flex-direction:column;min-height:0}
.field{position:relative;flex:1;min-height:200px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#killfeed{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.kf{background:rgba(5,7,15,.75);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700;animation:kfin .25s ease-out}
.kf .y{color:var(--cyan)} .kf .e{color:var(--red)} .kf .hs{color:var(--gold)}
@keyframes kfin{from{transform:translateX(30px);opacity:0}}
#bossbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(60%,320px);pointer-events:none}
#bossbar .lbl{font-family:Orbitron;font-size:10px;color:var(--red);letter-spacing:.2em;text-align:center;margin-bottom:3px}
#bossbar .bar{display:flex;gap:3px;height:9px}
#bossbar .bar i{flex:1;background:var(--red);box-shadow:0 0 8px var(--red);border-radius:2px;transition:opacity .3s}
#bossbar .bar i.dead{opacity:.15;box-shadow:none}
#debrief{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,14,28,.94);border:1px solid #5a2030;border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.3;max-height:60%;overflow:auto}
#debrief h4{margin:0 0 4px;font-family:Orbitron;font-size:12px;letter-spacing:.18em;color:var(--red)}
#debrief ul{margin:0;padding-left:18px}
#debrief li{margin:3px 0}
#debrief .x{position:absolute;top:6px;right:8px;background:transparent;color:var(--dim);font-size:18px;padding:2px 6px}
#debrief .walk{margin-top:8px;background:var(--gold);color:#201400;border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}

.controls{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
#formTabs{display:flex;gap:6px}
#formTabs button{flex:1;padding:6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--dim)}
#formTabs button.on{color:#021018;background:var(--cyan);border-color:var(--cyan)}
#eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;font-size:22px;font-weight:700;min-height:44px;font-family:Rajdhani}
#eq .slot{min-width:46px;padding:4px 6px;border-radius:8px;background:#060a16;border:2px solid var(--line);text-align:center;font-size:21px;font-weight:700;color:#fff;line-height:1.15}
#eq .slot .ph{color:#3e4b6e;font-size:16px}
#eq .slot.on{border-color:var(--cyan);box-shadow:0 0 12px rgba(41,231,255,.5)}
#eq .slot.lock{border-style:dashed;color:var(--dim);background:transparent}
#eq .slot.bad{border-color:var(--red)}
#pretty{text-align:center;color:var(--dim);font-size:15px;min-height:18px;margin-top:-4px}
#pretty b{color:var(--cyan)}
.row{display:flex;gap:6px}
.actions button{padding:10px 6px;border-radius:10px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
#intelBtn{flex:1} #scopeBtn{flex:1}
#fireBtn{flex:1.6;font-family:Orbitron;font-weight:900;letter-spacing:.2em;font-size:17px;color:#1a0016;background:linear-gradient(180deg,#ff6af5,#c0169f);border:none;box-shadow:0 0 18px rgba(255,61,242,.45)}
#fireBtn:disabled{opacity:.4;box-shadow:none}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keypad button{padding:10px 0;border-radius:9px;background:#18233f;border:1px solid var(--line);font-size:20px;font-weight:700}
.keypad button:active{background:#24345e}
.keypad .fn{color:var(--cyan);font-size:16px}

@media (min-width:860px) and (orientation:landscape){
  .gamebody{flex-direction:row}
  .controls{width:380px;border-top:none;border-left:1px solid var(--line);justify-content:center}
  .keypad button{padding:14px 0}
}
@media (max-height:640px) and (orientation:portrait){
  .keypad button{padding:7px 0;font-size:18px}
  .actions button{padding:8px 6px}
}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(2,4,10,.78);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(3px)}
.card{width:min(460px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#121c38,#0a1022);border:1px solid #2b3d6e;border-radius:16px;padding:18px;box-shadow:0 0 40px rgba(41,231,255,.15)}
.card h2{font-family:Orbitron;margin:0 0 4px;font-size:20px;letter-spacing:.08em}
.card .kicker{font-family:Orbitron;font-size:11px;letter-spacing:.22em;color:var(--mag)}
.card p{font-size:17px;line-height:1.35;margin:10px 0}
.card .lesson{background:#081022;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.35;margin:10px 0}
.card .hint{background:#1d1606;border:1px solid #4a3a10;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:16px;margin:8px 0}
.card ol{padding-left:22px;font-size:16px;line-height:1.45}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.card .btns .big{width:100%;font-size:15px;padding:13px}
.bigstars{font-size:46px;text-align:center;letter-spacing:8px;color:var(--gold);text-shadow:0 0 18px rgba(255,201,74,.6);margin:6px 0}
.bigstars .off{color:#2a3352;text-shadow:none}
.reward{display:flex;justify-content:center;gap:16px;font-family:Orbitron;font-size:14px;margin:4px 0 8px}
.reward .xp{color:var(--cyan)} .reward .cr{color:var(--gold)}
.rankup{text-align:center;font-family:Orbitron;color:var(--gold);font-size:15px;margin:8px 0;animation:pulse 1s infinite alternate}
@keyframes pulse{to{text-shadow:0 0 16px var(--gold)}}
.math{font-weight:700;color:#fff;white-space:nowrap}
</style>
</head>
<body>
<div id="app">

  <!-- MENU -->
  <section id="menu" class="screen active">
    <div class="logo">TRAJECTORY</div>
    <div class="sub">QUADRATIC STRIKE</div>
    <div class="rankcard" id="rankcard"></div>
    <button class="big" data-go="missions">CAMPAIGN</button>
    <button class="big mag" id="drillBtn">ENDLESS DRILL</button>
    <button class="big alt" data-go="record">SERVICE RECORD &amp; ARMORY</button>
    <button class="ghostbtn" id="muteBtn"></button>
  </section>

  <!-- MISSIONS -->
  <section id="missions" class="screen">
    <div class="topbar"><button class="back" data-go="menu">‹ Back</button><h2>CAMPAIGN</h2></div>
    <div class="scroll" id="missionList"></div>
  </section>

  <!-- RECORD -->
  <section id="record" class="screen">
    <div class="topbar"><button class="back" data-go="menu">‹ Back</button><h2>SERVICE RECORD</h2></div>
    <div class="scroll" id="recordBody"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="hud">
      <button class="back" id="quitBtn">‹</button>
      <div class="title"><div class="t1" id="hudT1"></div><div class="t2" id="hudT2"></div></div>
      <span class="pill" id="hudShots"></span>
      <span class="pill cr" id="hudCredits"></span>
    </div>
    <div class="gamebody">
      <div class="field">
        <canvas id="cv"></canvas>
        <div id="bossbar" class="hidden"><div class="lbl">DREADNOUGHT</div><div class="bar"></div></div>
        <div id="killfeed"></div>
        <div id="debrief" class="hidden"></div>
      </div>
      <div class="controls">
        <div id="formTabs"></div>
        <div id="eq"></div>
        <div id="pretty"></div>
        <div class="row actions">
          <button id="intelBtn">💡 INTEL</button>
          <button id="scopeBtn">🔭 SCOPE</button>
          <button id="fireBtn">FIRE</button>
        </div>
        <div class="keypad" id="keypad"></div>
      </div>
    </div>
  </section>

  <div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>
</div>

<script>
"use strict";
/* =====================================================================
   MATH HELPERS
   ===================================================================== */
const FORMS = {
  factored: { label: 'Factored', skill: 'factored', slots: ['a','p','q'],
              tpl: ['y = ', 'a', '(x − ', 'p', ')(x − ', 'q', ')'] },
  vertex:   { label: 'Vertex', skill: 'vertex', slots: ['a','h','k'],
              tpl: ['y = ', 'a', '(x − ', 'h', ')² + ', 'k'] },
  standard: { label: 'Standard', skill: 'standard', slots: ['a','b','c'],
              tpl: ['y = ', 'a', 'x² + ', 'b', 'x + ', 'c'] },
};

function toStd(form, v) {
  const a = v.a;
  if (form === 'factored') return { a, b: -a * (v.p + v.q), c: a * v.p * v.q };
  if (form === 'vertex')   return { a, b: -2 * a * v.h, c: a * v.h * v.h + v.k };
  return { a, b: v.b, c: v.c };
}
function makeF(s) { return x => s.a * x * x + s.b * x + s.c; }

function fmt(n) {
  if (!isFinite(n)) return '?';
  let r = Math.round(n * 100) / 100;
  if (Object.is(r, -0)) r = 0;
  return String(r).replace('-', '−');
}
function parseNum(str) {
  if (str == null) return NaN;
  const s = String(str).replace(/−/g, '-').trim();
  if (!/^-?(\d+\.?\d*|\.\d+)(\/(\d+\.?\d*|\.\d+))?$/.test(s)) return NaN;
  const [n, d] = s.split('/');
  const v = d === undefined ? parseFloat(n) : parseFloat(n) / parseFloat(d);
  return isFinite(v) ? v : NaN;
}
function coefStr(a) { return a === 1 ? '' : a === -1 ? '−' : fmt(a); }
function shiftStr(p) { return p === 0 ? 'x' : p < 0 ? `(x + ${fmt(-p)})` : `(x − ${fmt(p)})`; }
function pretty(form, v) {
  if (form === 'factored') {
    const a = coefStr(v.a), s1 = shiftStr(v.p), s2 = shiftStr(v.q);
    return `y = ${a}${s1}${s2}`;
  }
  if (form === 'vertex') {
    let s = `y = ${coefStr(v.a)}${shiftStr(v.h)}²`;
    if (v.k > 0) s += ` + ${fmt(v.k)}`; else if (v.k < 0) s += ` − ${fmt(-v.k)}`;
    return s;
  }
  let s = 'y = ';
  const terms = [[v.a, 'x²'], [v.b, 'x'], [v.c, '']];
  let first = true;
  for (const [c, x] of terms) {
    if (c === 0) continue;
    const mag = Math.abs(c);
    const body = (mag === 1 && x) ? x : fmt(mag) + x;
    s += first ? (c < 0 ? '−' : '') + body : (c < 0 ? ' − ' : ' + ') + body;
    first = false;
  }
  return first ? 'y = 0' : s;
}
function distPointSeg(t, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L = dx * dx + dy * dy;
  let u = L ? ((t.x - a.x) * dx + (t.y - a.y) * dy) / L : 0;
  u = Math.max(0, Math.min(1, u));
  const px = a.x + u * dx - t.x, py = a.y + u * dy - t.y;
  return Math.sqrt(px * px + py * py);
}

/* =====================================================================
   SIMULATION (pure, testable)
   ===================================================================== */
const WALL_HALF = 0.15, CANNON_TOL = 0.35, HEADSHOT = 0.12;
function simulate(level, std) {
  const f = makeF(std), c = level.cannon, dir = level.dir || 1;
  const res = { path: [], hits: [], misfire: false, endReason: 'out', blocker: null, win: false };
  const y0 = f(c.x);
  if (!isFinite(y0) || Math.abs(y0 - c.y) > CANNON_TOL) { res.misfire = true; return res; }
  const v = level.view, step = 0.01 * dir;
  let prev = { x: c.x, y: y0 };
  res.path.push(prev);
  const hit = new Set();
  for (let i = 0; i < 40000; i++) {
    const x = prev.x + step, y = f(x), p = { x, y };
    res.path.push(p);
    level.targets.forEach((t, ti) => {
      if (hit.has(ti)) return;
      const d = distPointSeg(t, prev, p);
      if (d <= (t.r || 0.4)) { hit.add(ti); res.hits.push({ ti, d, idx: res.path.length - 1, headshot: d <= HEADSHOT }); }
    });
    if (hit.size === level.targets.length) { res.endReason = 'cleared'; break; }
    let stop = null;
    for (const w of level.walls || []) {
      if (Math.abs(x - w.x) <= WALL_HALF && y <= w.h && y >= 0) { stop = ['wall', w]; break; }
    }
    if (!stop) for (const b of level.barriers || []) {
      if (x >= b.x1 && x <= b.x2 && (prev.y - b.y) * (y - b.y) <= 0) { stop = ['barrier', b]; break; }
    }
    if (!stop && y < 0 && i > 0) stop = ['ground', null];
    if (!stop && (x > v.xmax + 0.5 || x < v.xmin - 0.5)) stop = ['out', null];
    if (stop) { res.endReason = stop[0]; res.blocker = stop[1]; break; }
    prev = p;
  }
  res.win = hit.size === level.targets.length;
  return res;
}

/* =====================================================================
   LEVELS
   ===================================================================== */
const CHAPTERS = [
  { id: 1, skill: 'factored', name: 'BOOT CAMP — FACTORED FORM',
    blurb: 'y = a(x − p)(x − q). The shot is at ground level (y = 0) at x = p and x = q.' },
  { id: 2, skill: 'vertex', name: 'APEX OPS — VERTEX FORM',
    blurb: 'y = a(x − h)² + k. The peak of the shot is the vertex (h, k).' },
  { id: 3, skill: 'standard', name: 'TOWER WAR — STANDARD FORM',
    blurb: 'y = ax² + bx + c. c is the launch height at x = 0. The peak is at x = −b / 2a.' },
  { id: 4, skill: 'discriminant', name: 'LASER GRID — DISCRIMINANT',
    blurb: 'b² − 4ac tells you how many times the arc crosses a line: 2, 1, or 0.' },
  { id: 5, skill: 'boss', name: 'BOSS — THE DREADNOUGHT', blurb: 'Every form is unlocked. Pick your weapon.' },
];

const LEVELS = [
  { id: 'L1', ch: 1, name: 'First Contact', forms: ['factored'], lock: { a: -0.5 },
    view: { xmin: -5, xmax: 7, ymin: -1, ymax: 10 },
    cannon: { x: -3, y: 0 }, targets: [{ x: 5, y: 0, type: 'tank' }],
    brief: 'An enemy tank is parked at x = 5. Your plasma cannon sits on the ground at x = −3.',
    lesson: 'In <span class="math">y = a(x − p)(x − q)</span>, the shot is on the ground (<span class="math">y = 0</span>) when <span class="math">x = p</span> or <span class="math">x = q</span>. Those are the <b>roots</b>. Launch from one root and land on the other.',
    hints: ['The shot starts on the ground and lands on the ground. Where is a(x − p)(x − q) equal to 0?',
            'y = 0 when x = p or x = q. Your cannon is at x = −3 and the tank is at x = 5.'],
    walk: ['Roots are the x-values where y = 0.', 'Cannon on the ground at x = −3, so one root is −3.', 'Tank on the ground at x = 5, so the other root is 5.', 'p = −3, q = 5 → y = −0.5(x + 3)(x − 5). Note: x − (−3) becomes x + 3.'],
    answer: { form: 'factored', a: -0.5, p: -3, q: 5 } },

  { id: 'L2', ch: 1, name: 'Wall Breaker', forms: ['factored'],

/* ---------- Endless drill generator ---------- */
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function genDrill(n) {
  const form = ['factored', 'vertex', 'standard'][n % 3];
  for (let tries = 0; tries < 500; tries++) {
    const a = pick([-0.25, -0.5, -1, -2]);
    if (form === 'factored') {
      const p = rnd(-6, 0), q = p + rnd(2, 10);
      const peak = -a * ((q - p) / 2) ** 2;
      if (peak < 3 || peak > 11) continue;
      const targets = [{ x: q, y: 0, type: 'tank' }];
      const mid = (p + q) / 2;
      targets.unshift({ x: mid, y: peak, type: 'drone' });
      return mkDrill(form, { a, p, q }, { x: p, y: 0 }, targets, p - 2, q + 2, peak);
    }
    if (form === 'vertex') {
      const h = rnd(-3, 3), d = rnd(1, 4), k = -a * d * d;
      if (k < 3 || k > 11) continue;
      return mkDrill(form, { a, h, k }, { x: h - d, y: 0 }, [{ x: h, y: k, type: 'drone' }, { x: h + d, y: 0, type: 'tank' }], h - d - 2, h + d + 2, k);
    }
    const sa = pick([-0.5, -1]), p = rnd(-4, -1), q = rnd(2, 6);
    const c = sa * p * q, b = -sa * (p + q);
    const vx = -b / (2 * sa), vy = c - b * b / (4 * sa);
    if (c > 10 || vy > 11 || vx <= 0.5) continue;
    return mkDrill(form, { a: sa, b, c }, { x: 0, y: c }, [{ x: vx, y: vy, type: 'drone' }, { x: q, y: 0, type: 'tank' }], -2, q + 2, vy);
  }
}
function mkDrill(form, ans, cannon, targets, xmin, xmax, peak) {
  const names = { factored: 'Root Strike', vertex: 'Peak Strike', standard: 'Tower Strike' };
  const lessons = {
    factored: 'Roots = where y = 0 (cannon and tank). Then use the drone to find a.',
    vertex: 'The drone is the peak: (h, k). Use your cannon to find a.',
    standard: 'c = your tower height. Peak x = −b / (2a). Use two points to find a and b.',
  };
  return { id: 'D', drill: true, name: names[form], forms: [form], ch: 0,
    view: { xmin, xmax, ymin: -1, ymax: Math.max(8, Math.ceil(peak + 2)) },
    cannon, targets, brief: lessons[form], lesson: lessons[form],
    hints: [lessons[form]], walk: [`Answer: ${pretty(form, ans)}`], answer: Object.assign({ form }, ans) };
}

let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(type, f0, f1, dur, vol) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, lp) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = lp; s.buffer = buf; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}

  });
  h += `</div><div class="sec">SKILL REPORT</div><div class="small">Shots fired, missions cleared, and how often he got it on the first shot. Use it to see which forms need work.</div>`;
  for (const k in names) {

  $('#resetBtn').addEventListener('click', () => modal(`<div class="kicker">CONFIRM</div><h2>Reset progress?</h2><p>All XP, stars, credits and stats will be wiped.</p>
    <div class="btns"><button class="big mag" id="mYes">Yes, reset</button><button class="big alt" id="mNo">Cancel</button></div>`,
    { mYes: () => { const m = S.muted; S = freshSave(); S.muted = m; save(); closeModal(); renderRecord(); }, mNo: closeModal }));

/* ---------- modal ---------- */
function modal(html, handlers) {
  $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden');
  for (const id in handlers || {}) { const el = document.getElementById(id); if (el) el.addEventListener('click', () => { SFX.click(); handlers[id](); }); }
}
function closeModal() { $('#modal').classList.add('hidden'); }

/* =====================================================================
   GAME STATE
   ===================================================================== */
let G = null, running = false, loopOn = false;
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function startLevel(L, opts = {}) {
  const form = L.forms[0];
  G = { L, form, inputs: {}, active: null, shots: 0, misses: 0, hintLevel: 0, walk: false, anim: null,
        ghost: null, scopeUntil: 0, dead: new Set(), particles: [], floats: [], shake: 0, done: false,
        drill: !!L.drill, streak: opts.streak || 0, drillN: opts.drillN || 0 };
  initInputs();
  $('#killfeed').innerHTML = '';
  $('#debrief').classList.add('hidden');
  show('game');
  updateHUD(); renderControls();
  const bb = $('#bossbar');
  if (L.boss) { bb.classList.remove('hidden'); bb.querySelector('.bar').innerHTML = L.targets.map(() => '<i></i>').join(''); }
  else bb.classList.add('hidden');
  if (!G.drill || G.drillN === 0) showBrief(true);
}
function initInputs() {
  G.inputs = {};
  const lock = (G.L.forms.length === 1 && G.L.lock) || {};
  FORMS[G.form].slots.forEach(k => { G.inputs[k] = lock[k] !== undefined ? fmt(lock[k]) : ''; });
  G.locked = lock;
  G.active = FORMS[G.form].slots.find(k => lock[k] === undefined);
}
function updateHUD() {
  const L = G.L;
  $('#hudT1').textContent = G.drill ? `ENDLESS DRILL · STREAK ${G.streak}` : L.boss ? 'BOSS FIGHT' : `MISSION ${L.index + 1} · ${CHAPTERS[L.ch - 1].name.split(' — ')[1]}`;
  $('#hudT2').textContent = L.name;
  $('#hudShots').textContent = `SHOTS ${G.shots}`;
  $('#hudCredits').textContent = `${S.credits} ¢`;
  $('#scopeBtn').textContent = `🔭 SCOPE ${SCOPE_COST}¢`;
}

/* ---------- controls ---------- */
const KEYS = ['7','8','9','−','⌫','4','5','6','/','.','1','2','3','0','▶'];
function renderControls() {
  const L = G.L;
  const tabs = $('#formTabs');
  if (L.forms.length > 1) {
    tabs.classList.remove('hidden');
    tabs.innerHTML = L.forms.map(f => `<button data-f="${f}" class="${f === G.form ? 'on' : ''}">${FORMS[f].label}</button>`).join('');
    tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { G.form = b.dataset.f; initInputs(); SFX.click(); renderControls(); }));
  } else tabs.classList.add('hidden');
  renderEq();
  const kp = $('#keypad');
  if (!kp.dataset.built) {
    kp.innerHTML = KEYS.map(k => `<button data-k="${k}" class="${'◀▶⌫−/'.includes(k) ? 'fn' : ''}">${k}</button>`).join('');
    kp.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { pressKey(b.dataset.k); }));
    kp.dataset.built = '1';
  }
}
function renderEq() {
  const F = FORMS[G.form];
  $('#eq').innerHTML = F.tpl.map(part => {
    if (!F.slots.includes(part)) return `<span>${part}</span>`;
    const val = G.inputs[part], lock = G.locked[part] !== undefined;
    const bad = val && isNaN(parseNum(val));
    return `<button class="slot ${G.active === part ? 'on' : ''} ${lock ? 'lock' : ''} ${bad ? 'bad' : ''}" data-s="${part}">${val ? val.replace('-', '−') : `<span class="ph">${part}</span>`}</button>`;
  }).join('');
  $('#eq').querySelectorAll('.slot').forEach(b => b.addEventListener('click', () => {
    if (G.locked[b.dataset.s] !== undefined) { toast('🔒 Locked for this mission'); return; }
    G.active = b.dataset.s; SFX.click(); renderEq();
  }));
  const v = readValues();
  $('#pretty').innerHTML = v ? `<b>${pretty(G.form, v)}</b>` : 'Fill in every box, then FIRE';
  $('#fireBtn').disabled = !v || !!G.anim;
}
function readValues() {
  const out = {};
  for (const k of FORMS[G.form].slots) { const n = parseNum(G.inputs[k]); if (isNaN(n)) return null; out[k] = n; }
  return out;
}
function pressKey(k) {
  if (!G || G.anim) return;
  SFX.click();
  const slots = FORMS[G.form].slots.filter(s => G.locked[s] === undefined);
  if (k === '◀' || k === '▶') {
    let i = slots.indexOf(G.active); i = (i + (k === '▶' ? 1 : -1) + slots.length) % slots.length;
    G.active = slots[i]; renderEq(); return;
  }
  if (!G.active) return;
  let s = G.inputs[G.active] || '';
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '−') s = s.startsWith('-') ? s.slice(1) : '-' + s;
  else if (s.replace('-', '').length < 7) s += k;
  G.inputs[G.active] = s;
  G.ghostStale = true;
  renderEq();
}
document.addEventListener('keydown', e => {
  if (!running || !G) return;
  if (!$('#modal').classList.contains('hidden')) { if (e.key === 'Enter') { const b = $('#modalCard .big'); b && b.click(); } return; }
  const map = { Backspace: '⌫', '-': '−', ArrowLeft: '◀', ArrowRight: '▶', Tab: '▶' };
  if (e.key === 'Enter') { e.preventDefault(); fire(); return; }
  const k = map[e.key] || (/^[0-9./]$/.test(e.key) ? e.key : null);
  if (k) { e.preventDefault(); pressKey(k); }
});

let toastT = 0;
function toast(msg) { G && G.floats.push({ text: msg, x: W / 2, y: H * 0.4, life: 1.4, color: '#ffc94a', size: 18, center: true }); }

/* ---------- intel / brief ---------- */
function showBrief(first) {
  const L = G.L;
  let h = `<div class="kicker">${L.boss ? 'BOSS BRIEFING' : G.drill ? 'DRILL INTEL' : 'MISSION BRIEFING'}</div><h2>${L.name}</h2><p>${L.brief}</p>`;
  if (!G.drill) h += `<div class="lesson">${L.lesson}</div>`;
  if (!first) {
    for (let i = 0; i < G.hintLevel; i++) h += `<div class="hint">💡 ${L.hints[i]}</div>`;
    if (G.walk) h += `<div class="hint"><b>WALKTHROUGH</b><ol>${L.walk.map(s => `<li>${s}</li>`).join('')}</ol></div>`;
  }
  h += '<div class="btns">';
  if (first) h += `<button class="big" id="mGo">DEPLOY</button>`;
  else {
    if (G.hintLevel < L.hints.length) h += `<button class="big alt" id="mHint">Get hint ${G.hintLevel + 1} <span class="small">(max ★★ this mission)</span></button>`;
    if (!G.walk && G.misses >= 3) h += `<button class="big alt" id="mWalk">Show walkthrough <span class="small">(max ★)</span></button>`;
    else if (!G.walk && !G.drill) h += `<div class="small" style="text-align:center">Walkthrough unlocks after 3 misses (${G.misses}/3)</div>`;
    h += `<button class="big" id="mGo">BACK TO BATTLE</button>`;
  }
  h += '</div>';
  modal(h, {
    mGo: closeModal,
    mHint: () => { G.hintLevel++; showBrief(false); },
    mWalk: () => { G.walk = true; showBrief(false); },
  });
}
$('#intelBtn').addEventListener('click', () => { SFX.click(); showBrief(false); });
$('#quitBtn').addEventListener('click', () => { SFX.click(); const d = G && G.drill; G = null; show(d ? 'menu' : 'missions'); });
$('#scopeBtn').addEventListener('click', () => {
  if (!G || G.anim) return;
  const v = readValues();
  if (!v) { toast('Fill in every box first'); return; }
  if (S.credits < SCOPE_COST) { toast('Not enough credits. Win missions to earn more.'); SFX.fail(); return; }
  S.credits -= SCOPE_COST; save(); updateHUD();
  G.scope = { std: toStd(G.form, v), until: performance.now() + 3000 };
  tone('sine', 400, 1200, 0.3, 0.08);
});
$('#fireBtn').addEventListener('click', fire);

/* ---------- firing ---------- */
function fire() {
  if (!G || G.anim || G.done) return;
  const v = readValues(); if (!v) { toast('Fill in every box first'); return; }
  ac();
  const std = toStd(G.form, v);
  const sim = simulate(G.L, std);
  G.shots++; updateHUD();
  const sk = G.drill ? 'drill' : CHAPTERS[G.L.ch - 1].skill;
  S.stats[sk].s++; save();
  G.dead = new Set(); G.particles = [];
  $('#debrief').classList.add('hidden');
  G.ghost = { std, values: v, form: G.form };
  G.scope = null;
  if (G.L.boss) $('#bossbar').querySelectorAll('i').forEach(i => i.classList.remove('dead'));
  if (sim.misfire) {
    SFX.fail(); buzz(80); G.shake = 10;
    const c = G.L.cannon, sp = w2s(c.x, c.y);
    for (let i = 0; i < 20; i++) G.particles.push(part(sp.x, sp.y, '#ff4058'));
    G.floats.push({ text: 'MISFIRE', x: sp.x, y: sp.y - 30, life: 1.3, color: '#ff4058', size: 22 });
    onMiss(sim, std, v);
    return;
  }
  SFX.fire(); buzz(20);
  // precompute screen-space path for animation
  const pts = sim.path.map(p => w2s(p.x, p.y));
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  G.anim = { sim, std, v, pts, cum, t0: performance.now(), speed: Math.max(500, W * 1.15), nextHit: 0, idx: 0 };
  renderEq();
}
function part(x, y, color, spd = 1) {
  const a = Math.random() * Math.PI * 2, s = (40 + Math.random() * 260) * spd;
  return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5 + Math.random() * 0.6, max: 1.1, color, size: 1.5 + Math.random() * 3 };
}
function targetName(t) { return { tank: 'Tank', drone: 'Drone', turret: 'Turret', gate: 'Jump Gate', sensor: 'Sensor', core: 'Reactor Core' }[t.type] || 'Target'; }
function killfeed(html) {
  const el = document.createElement('div'); el.className = 'kf'; el.innerHTML = html;
  const kf = $('#killfeed'); kf.prepend(el); while (kf.children.length > 4) kf.lastChild.remove();
  setTimeout(() => el.remove(), 4500);
}
function stepAnim(now) {
  const A = G.anim; if (!A) return;
  const dist = (now - A.t0) / 1000 * A.speed;
  while (A.idx < A.pts.length - 1 && A.cum[A.idx + 1] <= dist) A.idx++;
  // trigger hits
  while (A.nextHit < A.sim.hits.length && A.sim.hits[A.nextHit].idx <= A.idx) {
    const h = A.sim.hits[A.nextHit++], t = G.L.targets[h.ti], sp = w2s(t.x, t.y);
    G.dead.add(h.ti);
    const big = t.type === 'core';
    for (let i = 0; i < (big ? 70 : 40); i++) G.particles.push(part(sp.x, sp.y, i % 3 ? plasmaColor(now) : '#ffb347', big ? 1.6 : 1));
    G.shake = big ? 18 : 9;
    SFX.hit(); buzz(big ? [60, 40, 90] : 50);
    const youTag = `<span class="y">YOU</span>`;
    if (h.headshot) {
      SFX.head();
      G.floats.push({ text: 'CRITICAL HIT +50', x: sp.x, y: sp.y - 26, life: 1.4, color: '#ffc94a', size: 18 });
      killfeed(`${youTag} ⟶ <span class="hs">✸ CRIT</span> ⟶ <span class="e">${targetName(t)}</span>`);
    } else {
      G.floats.push({ text: t.type === 'gate' || t.type === 'sensor' ? 'THROUGH +100' : 'HIT +100', x: sp.x, y: sp.y - 24, life: 1.1, color: '#fff', size: 16 });
      killfeed(`${youTag} ⟶ ✦ ⟶ <span class="e">${targetName(t)}</span>`);
    }
    G.floats.push({ text: '✕', x: sp.x, y: sp.y, life: 0.35, color: '#fff', size: 34, center: true, marker: true });
    if (G.L.boss) $('#bossbar').querySelectorAll('i')[h.ti].classList.add('dead');
  }
  if (A.idx >= A.pts.length - 1) {
    const end = A.pts[A.pts.length - 1];
    if (A.sim.endReason !== 'cleared' && A.sim.endReason !== 'out') {
      for (let i = 0; i < 18; i++) G.particles.push(part(end.x, end.y, A.sim.endReason === 'barrier' ? '#ff4058' : '#9fb3e6', 0.6));
      if (A.sim.endReason === 'barrier') { SFX.fail(); G.floats.push({ text: 'ZAPPED', x: end.x, y: end.y - 20, life: 1.1, color: '#ff4058', size: 18 }); }
      else if (A.sim.endReason === 'wall') { noise(0.25, 0.4, 600); G.floats.push({ text: 'BLOCKED', x: end.x, y: end.y - 20, life: 1.1, color: '#ff4058', size: 18 }); }
    }
    const sim = A.sim, std = A.std, v = A.v;
    G.anim = null;
    if (sim.win) setTimeout(() => onWin(sim), 700);
    else setTimeout(() => onMiss(sim, std, v), 350);
    renderEq();
  }
}

/* ---------- outcomes ---------- */
function onMiss(sim, std, v) {
  if (!G) return;
  G.misses++;
  if (G.drill) { G.streak = 0; updateHUD(); }
  const L = G.L, f = makeF(std), lines = [];
  if (sim.misfire) {
    lines.push(`<b>Misfire.</b> At x = ${fmt(L.cannon.x)} your arc is at y = ${fmt(f(L.cannon.x))}, but your cannon sits at y = ${fmt(L.cannon.y)}. The arc has to pass through your cannon.`);
  } else if (sim.endReason === 'wall') {
    const w = sim.blocker; lines.push(`<b>Blocked.</b> At the wall (x = ${fmt(w.x)}) your shot was only at y = ${fmt(f(w.x))}. The wall is ${fmt(w.h)} high.`);
  } else if (sim.endReason === 'barrier') {
    const b = sim.blocker, vx = -std.b / (2 * std.a);
    lines.push(`<b>Zapped</b> by the laser at y = ${fmt(b.y)}. Your arc climbs to y = ${fmt(f(vx))}.`);
  }
  if (!sim.misfire) {
    const hitIdx = new Set(sim.hits.map(h => h.ti));
    L.targets.forEach((t, i) => {
      if (hitIdx.has(i)) return;
      lines.push(`Missed the ${targetName(t).toLowerCase()} at (${fmt(t.x)}, ${fmt(t.y)}). At x = ${fmt(t.x)} your arc is at y = ${fmt(f(t.x))}.`);
    });
  }
  if (std.a > 0) lines.push(`Your a is positive, so the parabola opens <b>up</b> like a U. A shot that arcs over needs a <b>negative</b> a.`);
  else if (std.a === 0) lines.push(`a = 0 makes a straight line, not a parabola.`);
  else {
    const vx = -std.b / (2 * std.a), vy = f(vx), D = std.b * std.b - 4 * std.a * std.c;
    let s = `Your arc: peak at (${fmt(vx)}, ${fmt(vy)})`;
    if (D >= 0) { const r1 = (-std.b + Math.sqrt(D)) / (2 * std.a), r2 = (-std.b - Math.sqrt(D)) / (2 * std.a); s += `, ground level (y = 0) at x = ${fmt(Math.min(r1, r2))} and x = ${fmt(Math.max(r1, r2))}`; }
    lines.push(s + '.');
  }
  let h = `<button class="x" id="dbx">✕</button><h4>DEBRIEF · SHOT ${G.shots}</h4><ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul>`;
  if (G.misses >= 3 && !G.walk) h += `<button class="walk" id="dbw">💡 Walkthrough unlocked</button>`;
  else if (G.misses >= 2 && G.hintLevel === 0) h += `<button class="walk" id="dbw">💡 Need a hint?</button>`;
  const d = $('#debrief'); d.innerHTML = h; d.classList.remove('hidden');
  $('#dbx').addEventListener('click', () => d.classList.add('hidden'));
  const w = $('#dbw'); if (w) w.addEventListener('click', () => showBrief(false));
  if (G.drill && G.misses >= 3 && !G.walk) { G.walk = true; }
}
function onWin(sim) {
  if (!G) return;
  G.done = true;
  SFX.win();
  const L = G.L, sk = G.drill ? 'drill' : CHAPTERS[L.ch - 1].skill;
  S.stats[sk].w++; if (G.shots === 1) S.stats[sk].f++;
  const before = rankIndex(S.xp);
  const crits = sim.hits.filter(h => h.headshot).length;
  let stars = G.shots === 1 ? 3 : G.shots <= 3 ? 2 : 1;
  if (G.hintLevel > 0) stars = Math.min(stars, 2);
  if (G.walk) stars = 1;
  let xp, cr;
  if (G.drill) {
    G.streak++; S.bestStreak = Math.max(S.bestStreak, G.streak);
    const mult = Math.min(1 + G.streak * 0.25, 3);
    xp = Math.round((G.shots === 1 ? 80 : 40) * mult + crits * 25); cr = 10 + crits * 5;
  } else {
    const prev = S.stars[L.id] || 0;
    const firstClear = !prev;
    xp = (firstClear ? 100 * stars : 25 * stars) + crits * 50 + (L.boss && firstClear ? 400 : 0);
    cr = (firstClear ? 25 : 10) + crits * 10 + (L.boss && firstClear ? 100 : 0);
    S.stars[L.id] = Math.max(prev, stars);
  }
  S.xp += xp; S.credits += cr; save(); updateHUD();
  const after = rankIndex(S.xp);
  let h = `<div class="kicker">${G.drill ? 'TARGETS DOWN · STREAK ' + G.streak : L.boss ? 'DREADNOUGHT DESTROYED' : 'MISSION COMPLETE'}</div><h2>${L.name}</h2>`;
  if (!G.drill) h += `<div class="bigstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>`;
  h += `<div class="reward"><span class="xp">+${xp} XP</span><span class="cr">+${cr} ¢</span>${crits ? `<span style="color:var(--gold)">${crits}× CRIT</span>` : ''}</div>`;
  h += `<p style="text-align:center;font-size:16px;color:var(--dim)">${G.shots === 1 ? 'First-shot kill.' : `Took ${G.shots} shots.`} Winning equation:<br><span class="math" style="color:var(--cyan)">${pretty(G.ghost.form, G.ghost.values)}</span></p>`;
  if (after > before) {
    h += `<div class="rankup">▲ PROMOTED TO ${RANKS[after][1].toUpperCase()} ▲</div>`;
    const col = COLORS.find(c => c.rank === after);
    if (col) h += `<div class="small" style="text-align:center">New plasma color unlocked in the Armory: <b style="color:${col.c === 'rgb' ? '#fff' : col.c}">${col.name}</b></div>`;
  }
  h += '<div class="btns">';
  const next = !G.drill && LEVELS[L.index + 1];
  if (G.drill) h += `<button class="big mag" id="mNext">NEXT TARGET</button>`;
  else if (next) h += `<button class="big" id="mNext">NEXT MISSION</button>`;
  else h += `<button class="big mag" id="mDrill">CAMPAIGN CLEAR: TRY ENDLESS DRILL</button>`;
  if (!G.drill && stars < 3) h += `<button class="big alt" id="mRetry">Replay for ★★★</button>`;
  h += `<button class="big alt" id="mMenu">${G.drill ? 'End drill' : 'Mission list'}</button></div>`;
  const g = G;
  modal(h, {
    mNext: () => { closeModal(); g.drill ? startLevel(genDrill(g.drillN + 1), { streak: g.streak, drillN: g.drillN + 1 }) : startLevel(next); },
    mDrill: () => { closeModal(); startDrill(); },
    mRetry: () => { closeModal(); startLevel(L); },
    mMenu: () => { closeModal(); G = null; show(g.drill ? 'menu' : 'missions'); },
  });
}
function startDrill() { startLevel(genDrill(0), { streak: 0, drillN: 0 }); }
$('#drillBtn').addEventListener('click', () => { SFX.click(); startDrill(); });

/* =====================================================================
   RENDERING
   ===================================================================== */
const PAD = { l: 30, r: 10, t: 12, b: 22 };
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { if (running) resize(); });
function w2s(x, y) {
  const v = G.L.view, pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
  return { x: PAD.l + (x - v.xmin) / (v.xmax - v.xmin) * pw, y: PAD.t + (v.ymax - y) / (v.ymax - v.ymin) * ph };

  // projectile

    ctx.lineCap = 'round';
    for (let k = Math.max(1, i - 60); k <= i; k++) {

function label(text, x, y, color) {
